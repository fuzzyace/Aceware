name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Upload the .geode
        uses: actions/upload-artifact@v4
        with:
          name: Aceware
          path: ${{ steps.build.outputs.build-output }}

      # tagged push (v1.4.3) -> a release carrying the .geode, which is also what
      # the mod's own auto-update looks for
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          p="${{ steps.build.outputs.build-output }}"
          if [ -d "$p" ]; then f=$(ls "$p"/*.geode | head -n 1); else f="$p"; fi
          cp "$f" Aceware.geode
          gh release create "${GITHUB_REF_NAME}" Aceware.geode \
            -R "$GITHUB_REPOSITORY" --title "Aceware ${GITHUB_REF_NAME#v}" --generate-notes
